openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /declined-explainer/polish-status:
    get:
      operationId: getDeclinedExplainerPolishStatus
      tags: [declined-explainer]
      summary: Check whether optional letter wording is configured
      responses:
        "200":
          description: Wording configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterPolishStatus"
  /declined-explainer/polish-letter:
    post:
      operationId: polishDeclinedApplicationLetter
      tags: [declined-explainer]
      summary: Optionally rewrite a precomputed decline letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LetterPolishInput"
      responses:
        "200":
          description: Reworded letter or deterministic template fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterPolishOutput"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LetterPolishStatus:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
    LetterPolishInput:
      type: object
      properties:
        draft:
          type: string
          maxLength: 8000
        requiredFacts:
          type: array
          items:
            type: string
            maxLength: 500
          maxItems: 12
      required:
        - draft
        - requiredFacts
    LetterPolishOutput:
      type: object
      properties:
        letter:
          type: string
        source:
          type: string
          enum: [template, anthropic]
      required:
        - letter
        - source
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

